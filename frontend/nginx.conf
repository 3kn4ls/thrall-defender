server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirección de / a /thrall-defender/
    location = / {
        return 301 /thrall-defender/;
    }

    # Frontend con path /thrall-defender
    location /thrall-defender {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /thrall-defender/index.html;

        # Configuraciones de cache para assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Proxy pass para el backend API
    location /thrall-defender/api {
        rewrite ^/thrall-defender/api/(.*) /api/$1 break;
        proxy_pass http://thrall-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /thrall-defender/ws {
        rewrite ^/thrall-defender/ws/(.*) /ws/$1 break;
        proxy_pass http://thrall-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
