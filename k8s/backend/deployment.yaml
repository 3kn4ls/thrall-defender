apiVersion: apps/v1
kind: Deployment
metadata:
  name: thrall-backend
  namespace: thrall-defender
  labels:
    app: thrall-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thrall-backend
  template:
    metadata:
      labels:
        app: thrall-backend
    spec:
      # hostNetwork permite captura de paquetes de la red del host
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      containers:
      - name: backend
        image: thrall-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http

        envFrom:
        - configMapRef:
            name: thrall-backend-config

        volumeMounts:
        - name: data
          mountPath: /data

        # Capabilities necesarias para captura de paquetes
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: thrall-backend-data
