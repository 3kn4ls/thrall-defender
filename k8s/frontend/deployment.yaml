apiVersion: apps/v1
kind: Deployment
metadata:
  name: thrall-frontend
  namespace: thrall-defender
  labels:
    app: thrall-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thrall-frontend
  template:
    metadata:
      labels:
        app: thrall-frontend
    spec:
      containers:
      - name: frontend
        image: thrall-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
